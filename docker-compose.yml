services:
  db:
    image: mysql:8.0
    container_name: tripledger-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tripledger
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tripledger-redis
    restart: always
    ports:
      - "6379:6379"

  api1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripledger-api-1
    restart: always
    environment:
      PORT: "8080"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: "root"
      DB_NAME: "tripledger"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "tripledger-production-grade-jwt-secret"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  api2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripledger-api-2
    restart: always
    environment:
      PORT: "8080"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: "root"
      DB_NAME: "tripledger"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "tripledger-production-grade-jwt-secret"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: tripledger-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2

volumes:
  db_data:
